version: '3.8'

services:
  # Spring Boot API
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Connects to the 'db' container using matching DB name and password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/learning_center
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root1234
    depends_on:
      - db

  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: learning_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root1234
    ports:
      - "5433:5432"  # Changed from 5432:5432 to 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: